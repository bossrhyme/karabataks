<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hedef Bakiye Takip</title>
<meta name="description" content="Satır satır kazanılan tutarları ekle, ulaşmak istediğin hedef bakiyeye ne kadar yaklaştığını gör.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1117; --panel:#161b22; --panel2:#1c2330;
  --border:#262d3a; --border2:#323a49;
  --text:#e6edf3; --text2:#9aa6b2; --text3:#636e7b;
  --green:#26d07c; --green2:#1e9e60; --green-bg:rgba(38,208,124,.12);
  --red:#f85149; --red-bg:rgba(248,81,73,.12);
  --accent:#3b82f6; --gold:#ffd60a;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:12px; --rs:8px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}

header{border-bottom:1px solid var(--border);padding:16px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:rgba(14,17,23,.92);backdrop-filter:blur(8px);z-index:50}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:18px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand .sub{font-size:11.5px;color:var(--text3)}
.hsp{flex:1}
.cur-sel{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--border2);border-radius:20px;padding:3px}
.cur-sel button{border:none;background:transparent;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;padding:5px 12px;border-radius:16px;cursor:pointer;transition:.12s}
.cur-sel button.on{background:var(--green);color:#062012}

.wrap{max-width:720px;margin:0 auto;padding:22px}

/* HEDEF + İLERLEME */
.hero{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:18px}
.goal-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.goal-row label{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:block;margin-bottom:6px}
.goal-input{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 12px}
.goal-input span{color:var(--gold);font-weight:700;font-family:var(--mono)}
.goal-input input{background:transparent;border:none;color:var(--gold);font-family:var(--mono);font-size:20px;font-weight:700;width:150px;outline:none}
.goal-input input::placeholder{color:var(--text3);font-weight:400}

.big{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:-1px;line-height:1.1}
.big .sep{color:var(--text3);font-weight:400;font-size:22px}
.big .goal{color:var(--text2);font-size:22px;font-weight:600}
.pct-line{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 8px;flex-wrap:wrap;gap:8px}
.pct{font-size:15px;font-weight:700;font-family:var(--mono);color:var(--green)}
.remaining{font-size:13px;color:var(--text2)}
.remaining b{color:var(--text);font-family:var(--mono)}
.bar{height:14px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:10px;transition:width .5s ease}
.reached{margin-top:14px;background:var(--green-bg);border:1px solid var(--green);color:var(--green);border-radius:var(--rs);padding:10px 14px;font-weight:600;text-align:center;display:none}
.reached.show{display:block}

/* EKLEME */
.add{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.add h3{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.add-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.amt{width:150px}
.fld.note{flex:1;min-width:160px}
.fld label{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;padding-left:2px}
.fld input{background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:14px;padding:10px 12px;border-radius:var(--rs);outline:none;transition:.12s;width:100%}
.fld.amt input{font-family:var(--mono);font-weight:600}
.fld input:focus{border-color:var(--accent)}
.btn{font-family:var(--font);font-size:14px;font-weight:600;border:1px solid var(--green);background:var(--green);color:#062012;padding:10px 18px;border-radius:var(--rs);cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{background:#2ee089}
.btn:active{transform:translateY(1px)}

/* LİSTE */
.list{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.list-head h3{font-size:13px;font-weight:600}
.list-head .count{font-size:12px;color:var(--text3)}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
.rowi:last-child{border-bottom:none}
.rowi:hover{background:var(--panel2)}
.rowi .idx{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);font-family:var(--mono);flex-shrink:0}
.rowi .mid{flex:1;min-width:0}
.rowi .note{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .note.empty{color:var(--text3);font-style:italic;font-weight:400}
.rowi .date{font-size:11.5px;color:var(--text3);font-family:var(--mono)}
.rowi .amt{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--green);white-space:nowrap}
.rowi .amt input{background:transparent;border:1px solid transparent;color:var(--green);font-family:var(--mono);font-weight:600;font-size:15px;width:110px;text-align:right;padding:4px 6px;border-radius:6px;outline:none}
.rowi .amt input:hover{border-color:var(--border2)}
.rowi .amt input:focus{border-color:var(--accent);background:var(--bg)}
.del{background:transparent;border:none;color:var(--text3);cursor:pointer;padding:6px;border-radius:6px;line-height:0;font-size:15px;transition:.12s;flex-shrink:0}
.del:hover{color:var(--red);background:var(--red-bg)}
.empty-list{padding:30px;text-align:center;color:var(--text3);font-size:13px}
.list-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--panel2);border-top:1px solid var(--border)}
.list-foot .lbl{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.list-foot .tot{font-size:18px;font-weight:700;font-family:var(--mono);color:var(--green)}

footer{text-align:center;padding:24px;color:var(--text3);font-size:12px}

@media(max-width:560px){
  .big{font-size:28px}
  .fld.amt{width:100%}
  .btn{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="logo">🎯</div>
  <div class="brand">
    <h1>Hedef Bakiye Takip</h1>
    <div class="sub">Kazanılanı satır satır ekle, hedefe yaklaş</div>
  </div>
  <div class="hsp"></div>
  <div class="cur-sel" id="curSel">
    <button data-cur="₺">₺</button>
    <button data-cur="$">$</button>
    <button data-cur="€">€</button>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="goal-row">
      <div>
        <label>Ulaşılması gereken bakiye (hedef)</label>
        <div class="goal-input">
          <span id="goalSym">₺</span>
          <input type="number" step="any" min="0" id="goalInput" placeholder="0">
        </div>
      </div>
    </div>

    <div class="big"><span id="totalBig">—</span> <span class="sep">/</span> <span class="goal" id="goalBig">—</span></div>
    <div class="pct-line">
      <span class="pct" id="pct">%0</span>
      <span class="remaining">Kalan: <b id="remaining">—</b></span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="reached" id="reached">🎉 Hedefe ulaşıldı! Tebrikler.</div>
  </div>

  <div class="add">
    <h3>Kazanılan tutar ekle</h3>
    <div class="add-row">
      <div class="fld amt">
        <label>Tutar</label>
        <input type="number" step="any" id="amtInput" placeholder="0" inputmode="decimal">
      </div>
      <div class="fld note">
        <label>Açıklama (isteğe bağlı)</label>
        <input type="text" id="noteInput" placeholder="ör. freelance iş, satış…" maxlength="60">
      </div>
      <button class="btn" id="addBtn">+ Ekle</button>
    </div>
  </div>

  <div class="list">
    <div class="list-head">
      <h3>Kazanç kayıtları</h3>
      <span class="count" id="count">0 kayıt</span>
    </div>
    <div id="rows"></div>
    <div class="list-foot">
      <span class="lbl">Toplam Kazanılan</span>
      <span class="tot" id="totFoot">—</span>
    </div>
  </div>
</div>

<footer>Veriler yalnızca bu tarayıcıda saklanır (localStorage). Hiçbir yere gönderilmez.</footer>

<script>
const STORE_KEY = 'hedefBakiyeV1';
let state = load();

function def(){ return { goal:null, currency:'₺', entries:[] }; }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.entries) { s.currency = s.currency||'₺'; return s; } }catch(e){}
  return def();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function uid(){ return 'e'+Math.random().toString(36).slice(2,9); }

function cur(){ return state.currency || '₺'; }
function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return cur() + ' ' + Number(n).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function total(){ return state.entries.reduce((s,e)=> s + (Number(e.amount)||0), 0); }

function render(){
  const sym = cur();
  document.getElementById('goalSym').textContent = sym;
  // currency buttons
  document.querySelectorAll('#curSel button').forEach(b=> b.classList.toggle('on', b.dataset.cur===sym));
  // goal input (don't clobber while typing)
  const gi = document.getElementById('goalInput');
  if(document.activeElement!==gi) gi.value = (state.goal!=null ? state.goal : '');

  const tot = total();
  const goal = Number(state.goal)||0;
  const pct = goal>0 ? Math.min(100, tot/goal*100) : 0;
  const remaining = Math.max(0, goal - tot);

  document.getElementById('totalBig').textContent = fmt(tot);
  document.getElementById('goalBig').textContent = goal>0 ? fmt(goal) : 'hedef yok';
  document.getElementById('pct').textContent = '%' + pct.toLocaleString('tr-TR',{maximumFractionDigits:1});
  document.getElementById('remaining').textContent = goal>0 ? fmt(remaining) : '—';
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('reached').classList.toggle('show', goal>0 && tot>=goal);
  document.getElementById('totFoot').textContent = fmt(tot);
  document.getElementById('count').textContent = state.entries.length + ' kayıt';

  // rows (newest first)
  const rowsEl = document.getElementById('rows');
  if(!state.entries.length){
    rowsEl.innerHTML = '<div class="empty-list">Henüz kayıt yok. Yukarıdan ilk kazancını ekle.</div>';
    return;
  }
  const list = state.entries.slice().reverse();
  rowsEl.innerHTML = list.map((e,i)=>{
    const n = state.entries.length - i; // sıra no
    const d = e.date ? new Date(e.date).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'2-digit'}) : '';
    const note = e.note ? escapeHtml(e.note) : '';
    return `<div class="rowi">
      <div class="idx">${n}</div>
      <div class="mid">
        <div class="note ${note?'':'empty'}">${note||'(açıklama yok)'}</div>
        <div class="date">${d}</div>
      </div>
      <div class="amt"><input type="number" step="any" value="${Number(e.amount)||0}" data-id="${e.id}" data-f="amount"></div>
      <button class="del" data-del="${e.id}" title="Sil">✕</button>
    </div>`;
  }).join('');
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function addEntry(){
  const amtEl = document.getElementById('amtInput');
  const noteEl = document.getElementById('noteInput');
  const amt = parseFloat(amtEl.value);
  if(isNaN(amt) || amt===0){ amtEl.focus(); amtEl.style.borderColor='var(--red)'; setTimeout(()=>amtEl.style.borderColor='',900); return; }
  state.entries.push({ id:uid(), amount:amt, note:noteEl.value.trim(), date:new Date().toISOString() });
  save();
  amtEl.value=''; noteEl.value=''; amtEl.focus();
  render();
}

/* events */
document.getElementById('addBtn').addEventListener('click', addEntry);
document.getElementById('amtInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addEntry(); });
document.getElementById('noteInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addEntry(); });

document.getElementById('goalInput').addEventListener('input', e=>{
  const v = parseFloat(e.target.value);
  state.goal = (e.target.value==='' || isNaN(v)) ? null : v;
  save(); render();
});

document.getElementById('curSel').addEventListener('click', e=>{
  const b = e.target.closest('button[data-cur]'); if(!b) return;
  state.currency = b.dataset.cur; save(); render();
});

document.addEventListener('click', e=>{
  const d = e.target.closest('[data-del]'); if(!d) return;
  state.entries = state.entries.filter(x=> x.id!==d.dataset.del);
  save(); render();
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.f==='amount'){
    const ent = state.entries.find(x=> x.id===t.dataset.id);
    if(ent){ ent.amount = t.value==='' ? 0 : parseFloat(t.value); save();
      // sadece üst özetleri güncelle (satırı yeniden çizip focus kaybetme)
      const tot=total(), goal=Number(state.goal)||0, pct=goal>0?Math.min(100,tot/goal*100):0;
      document.getElementById('totalBig').textContent=fmt(tot);
      document.getElementById('pct').textContent='%'+pct.toLocaleString('tr-TR',{maximumFractionDigits:1});
      document.getElementById('remaining').textContent=goal>0?fmt(Math.max(0,goal-tot)):'—';
      document.getElementById('barFill').style.width=pct+'%';
      document.getElementById('totFoot').textContent=fmt(tot);
      document.getElementById('reached').classList.toggle('show', goal>0 && tot>=goal);
    }
  }
});
document.addEventListener('change', e=>{ if(e.target.dataset && e.target.dataset.f==='amount') render(); });

render();
</script>
</body>
</html>
